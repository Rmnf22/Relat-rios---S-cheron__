<script>(function(){'use strict';
const uid = () => globalThis.crypto?.randomUUID?.() || 'id-' + Math.random().toString(36).slice(2) + Date.now();
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const clone = x => JSON.parse(JSON.stringify(x));
function textBlock(text='',style='paragraph'){return {id:uid(),type:'text',text,style};}
function tableBlock(headers=['Item','Descrição','Resultado'],rows=[['','','']]){return {id:uid(),type:'table',headers,rows};}
function photoBlock(){return {id:uid(),type:'photos',columns:2,photos:[]};}
const presets = [
 {key:'free',title:'Tópico livre',description:'Seu título, textos, fotos e tabelas.'},
 {key:'inspection',title:'Inspeção visual',description:'Constatações e evidências fotográficas.'},
 {key:'isolation',title:'Ensaios de isolação',description:'Pontos de medição, valores e referência.'},
 {key:'functional',title:'Testes funcionais',description:'Verificações e resultados obtidos.'},
 {key:'events',title:'Análise de eventos do SEPCOS',description:'Registros, configurações e diagnóstico.'},
 {key:'parts',title:'Lista de peças de reposição',description:'Descrição, código e quantidade.'},
 {key:'tools',title:'Instrumentos utilizados',description:'Rastreabilidade e calibração.'},
 {key:'conclusion',title:'Conclusão',description:'Resultado do serviço e pendências.'},
 {key:'recommendations',title:'Recomendações ao cliente',description:'Ações e orientações para o cliente.'}
];
function newSection(key='free'){
 const preset=presets.find(x=>x.key===key)||presets[0];
 const s={id:uid(),title:key==='free'?'Novo tópico':preset.title,breakBefore:false,blocks:[textBlock()]};
 if(key==='inspection')s.blocks.push(photoBlock());
 if(key==='isolation')s.blocks.push(tableBlock(['Pontos ensaiados','Tensão aplicada','Duração','Valor medido','Critério / referência','Avaliação'],[['','','','','','']]));
 if(key==='functional')s.blocks.push(tableBlock(['Verificação','Resultado esperado','Resultado obtido','Avaliação'],[['','','','']]));
 if(key==='parts')s.blocks=[tableBlock(['Item','Descrição','Código','Quantidade'],[['1','','','']])];
 if(key==='tools')s.blocks=[tableBlock(['Instrumento','S/N','TAG','Certificado','Validade'],[['','','','','']])];
 if(key==='recommendations')s.blocks[0].style='bullet';
 return s;
}
function newReport(kind='field'){
 const date=today();
 return {version:1,id:uid(),numbering:{mode:'automatic',status:'draft',requestId:uid()},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
 meta:{kind,number:'',revision:'00',date,bu:'TPS',client:'',project:'',country:'Brasil',location:kind==='center'?'Laboratório - Sécheron Hasler do Brasil':'',status:'',request:'',scope:'',author:'',authorDate:date,reviewer:'',reviewDate:'',equipment:'',equipmentCode:'',serial:'',quantity:'1',filename:'',sheet:''},
 settings:{equipmentOn:kind==='center',revisionOn:true,numberSections:true,draft:true},
 revisions:[{revision:'00',date,author:'',description:'Primeira edição'}],
 sections:[{...newSection(),title:'Descrição dos serviços realizados'},newSection('conclusion')]};
}
function codeFor(r){const b=(r.meta.number||'SEM-NÚMERO').trim().replace(/^RT\s*/i,'').replace(/\.\d{2}$/,'');return b+'.'+String(r.meta.revision||'00').padStart(2,'0');}
function filenameFor(r){const m=r.meta;const n=m.filename.trim()||(m.project.trim()?`RT${codeFor(r)} - ${m.bu}_SEBR - ${m.project} - ${m.client}`:`RT${codeFor(r)} - ${m.bu} - SEBR - ${m.client}`);return n.replace(/\.(pdf|json)$/i,'').replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').slice(0,190);}
function displayDate(s){if(/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);return s||'';}
function missingFields(r){const issues=[['number','Número do relatório'],['bu','Unidade de negócio'],['client','Cliente'],['location','Localidade'],['date','Data do relatório'],['scope','Escopo'],['author','Elaborado por']].filter(([k])=>!r.meta[k]?.trim()).map(x=>x[1]);
 if(r.meta.number){const match=codeFor(r).match(/^\d{3,6}([FL])(0[1-9]|1[0-2])\d{2}\.\d{2}$/);if(!match)issues.push('Número completo no padrão NNNF/LMMYY.RR');else if(match[1]!== (r.meta.kind==='center'?'L':'F'))issues.push('Número correspondente à área selecionada');}
 return issues;}
function numberFromParts(sequence,kind,month,year,revision='00'){
 if(!/^\d{1,6}$/.test(String(sequence))||Number(sequence)<1||!/^\d{1,2}$/.test(String(month))||Number(month)<1||Number(month)>12||!/^\d{2}$/.test(String(year))||!/^\d{1,2}$/.test(String(revision)))throw new Error('Informe uma sequência positiva, mês de 01 a 12, ano com dois dígitos e revisão de 00 a 99.');
 return String(sequence).padStart(3,'0')+(kind==='center'?'L':'F')+String(month).padStart(2,'0')+year+'.'+String(revision).padStart(2,'0');
}
function applyRecord(r,record){
 const kind=record.sheet==='ServiceCenter'?'center':'field';
 r.meta.kind=kind;r.meta.number=String(record.number||'').replace(/^RT\s*/,'').replace(/\.\d{2}$/,'');r.meta.revision=String(record.revision??'00').padStart(2,'0');
 for(const k of ['bu','client','project','author','country'])r.meta[k]=record[k]!=null?String(record[k]):'';
 r.meta.location=record.location|| (kind==='center'?'Laboratório - Sécheron Hasler do Brasil':'');
 r.meta.filename='';r.meta.sheet=record.sheet+' · linha '+record.row;r.settings.equipmentOn=kind==='center';
 if(r.revisions.length===1){r.revisions[0].revision=r.meta.revision;r.revisions[0].author=r.meta.author;}
}
function validateReport(raw){
 if(!raw || raw.version!==1 || !raw.meta || !Array.isArray(raw.sections))throw new Error('Selecione um arquivo JSON exportado por este gerador.');
 if(raw.sections.length>200)throw new Error('O arquivo ultrapassa 200 tópicos.');
 const r=newReport();
 for(const k of Object.keys(r.meta))if(typeof raw.meta[k]==='string')r.meta[k]=raw.meta[k].slice(0,100000);
 if(!['field','center'].includes(r.meta.kind))r.meta.kind='field';
 for(const k of Object.keys(r.settings))if(typeof raw.settings?.[k]==='boolean')r.settings[k]=raw.settings[k];
 const n=raw.numbering;
 if(n){
  if(!['automatic','existing'].includes(n.mode)||!['draft','pending','registered'].includes(n.status)||!/^[a-zA-Z0-9-]{8,100}$/.test(n.requestId||''))throw new Error('Dados de numeração inválidos no editável.');
  r.numbering={mode:n.mode,status:n.status,requestId:String(n.requestId)};
  if(n.status!=='draft'){
   if(n.attempt?.requestId!==n.requestId||!n.attempt.metadata)throw new Error('A solicitação de registro está incompleta.');
   const keys=['kind','revision','date','bu','client','project','author','location','country'];
   r.numbering.attempt={version:1,requestId:n.requestId,metadata:Object.fromEntries(keys.map(k=>[k,String(n.attempt.metadata[k]??'').slice(0,1000)])),pdfValidated:true};
   if(n.status==='registered'){
    if(n.receipt?.requestId!==n.requestId||!/^\d{3,6}[FL](0[1-9]|1[0-2])\d{2}$/.test(n.receipt.number||''))throw new Error('O comprovante de registro está incompleto.');
    r.numbering.receipt={requestId:n.requestId,status:'registered',number:n.receipt.number,revision:String(n.receipt.revision),sheet:String(n.receipt.sheet),row:Number(n.receipt.row)||0,registeredAt:String(n.receipt.registeredAt||'')};
   }
  }
 }else r.numbering={mode:r.meta.number?'existing':'automatic',status:'draft',requestId:uid()};
 r.revisions=(Array.isArray(raw.revisions)?raw.revisions:[]).slice(0,100).map(v=>Object.fromEntries(['revision','date','author','description'].map(k=>[k,String(v[k]??'').slice(0,10000)])));
 r.sections=raw.sections.map(s=>({id:uid(),title:String(s.title??'').slice(0,1000),breakBefore:!!s.breakBefore,blocks:(Array.isArray(s.blocks)?s.blocks:[]).slice(0,200).map(b=>{
  if(b.type==='text')return {...textBlock(String(b.text??'').slice(0,200000)),style:['paragraph','bullet','numbered'].includes(b.style)?b.style:'paragraph'};
  if(b.type==='table'){
   const h=(Array.isArray(b.headers)?b.headers:[]).slice(0,10).map(v=>String(v).slice(0,1000));
   if(!h.length)throw new Error('Uma tabela do arquivo não tem colunas.');
   const rows=(Array.isArray(b.rows)?b.rows:[]).slice(0,2000).map(row=>h.map((_,i)=>String(row?.[i]??'').slice(0,20000)));
   return tableBlock(h,rows);
  }
  if(b.type==='photos')return {id:uid(),type:'photos',columns:b.columns===1?1:2,photos:(Array.isArray(b.photos)?b.photos:[]).slice(0,100).map(p=>{
   if(!/^data:image\/(jpeg|png);base64,[a-zA-Z0-9+/=]+$/.test(p.src||'')||p.src.length>12000000)throw new Error('Imagem inválida no arquivo. Use PNG ou JPEG.');
   return {id:uid(),src:p.src,caption:String(p.caption??'').slice(0,5000),name:String(p.name??'').slice(0,200)};
  })};
  throw new Error('Tipo de bloco desconhecido no arquivo.');
 })}));
 return r;
}
function parseDelimited(text){
 text=text.replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/)[0]||'';
 const sep=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
 let rows=[],row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
  else if(c===sep&&!quoted){row.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}
  else cell+=c;
 }
 row.push(cell);if(row.some(x=>x.trim()))rows.push(row);
 if(quoted)throw new Error('Há aspas sem fechamento na tabela.');

}

let installPrompt=null,registration=null,offlineReady=false,offlineError=false,installDone=false,waitingForUpdate=false;
const portable=!!globalThis.SECHERON_PORTABLE_ASSETS || globalThis.location?.protocol==='file:';
function distributionLabel(){
 if(portable)return 'Arquivo portátil · uso offline';
 if(waitingForUpdate)return 'Atualização disponível';

}
function refreshDistribution(){
 document.querySelectorAll('[data-distribution]').forEach(e=>e.textContent=distributionLabel());
 document.querySelectorAll('[data-action="install-app"]').forEach(e=>{e.hidden=portable||installDone||globalThis.matchMedia?.('(display-mode: standalone)').matches;});
 document.querySelectorAll('[data-action="update-app"]').forEach(e=>e.hidden=!waitingForUpdate);
}
async function setupOffline(){
 refreshDistribution();if(portable)return;
 window.addEventListener('online',refreshDistribution);window.addEventListener('offline',refreshDistribution);
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;refreshDistribution();});
 window.addEventListener('appinstalled',()=>{installDone=true;installPrompt=null;refreshDistribution();});
 if(!('serviceWorker' in navigator)||!globalThis.isSecureContext){offlineError=true;refreshDistribution();return;}
 try{
  registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  const hasUpdate=()=>{waitingForUpdate=!!registration.waiting;refreshDistribution();};hasUpdate();
  registration.addEventListener('updatefound',()=>{const worker=registration.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'){hasUpdate();if(!navigator.serviceWorker.controller){offlineReady=true;refreshDistribution();}}});});
  await navigator.serviceWorker.ready;offlineReady=true;refreshDistribution();

}

const registryFields=['kind','revision','date','bu','client','project','author','location','country'];
function registryState(r){
  if(!r.numbering)r.numbering={mode:r.meta.number?'existing':'automatic',status:'draft',requestId:uid()};
  return r.numbering;
}
function resetNumbering(r){
  r.numbering={mode:'automatic',status:'draft',requestId:uid()};
  r.meta.number='';r.meta.filename='';r.meta.sheet='';r.meta.revision='00';r.settings.draft=true;
}
function numberingLocked(r){return ['pending','registered'].includes(registryState(r).status);}
function nextSequence(catalog,kind){
  if(!catalog?.ready)return null;
  const sheet=kind==='center'?'ServiceCenter':'FieldService';
  const nums=catalog.records.filter(x=>x.sheet===sheet).map(x=>Number(x.sequence));
  if(nums.some(n=>!Number.isInteger(n)||n<1||n>999999))throw new Error('A sequência da planilha contém dados inválidos.');
  const next=nums.reduce((max,n)=>Math.max(max,n),0)+1;
  if(next>999999)throw new Error('A sequência excedeu o tamanho suportado.');
  return next;
}
function updateSuggestedNumber(r,catalog){
  const state=registryState(r);if(state.mode!=='automatic'||state.status!=='draft')return;
  const next=nextSequence(catalog,r.meta.kind);
  r.meta.number=next&&/^\d{4}-\d{2}-\d{2}$/.test(r.meta.date)?numberFromParts(next,r.meta.kind,r.meta.date.slice(5,7),r.meta.date.slice(2,4),'00').replace(/\.00$/,''):'';
  r.meta.revision='00';r.meta.filename='';r.settings.draft=true;
}
function numberingMessage(r,catalog){
  const state=registryState(r);
  if(state.status==='registered')return 'Número registrado na planilha. Baixar novamente reutiliza este registro.';
  if(state.status==='pending')return 'Confirmação pendente. Tente gerar novamente: a mesma solicitação será consultada, sem pedir outro número.';
  if(state.mode==='existing')return 'Número de um relatório já registrado. A exportação não cria uma nova linha na planilha.';

async function runDefinitive(r,{render,save,submit,online=true,configured=false}){

    Object.assign(r.meta,state.attempt.metadata,{number:state.receipt.number,filename:''});

  }

  if(!online)throw new Error('Conecte-se à internet para confirmar o número e registrar na planilha. O rascunho continua disponível offline.');

  const missing=missingFields(validation).filter(x=>x!=='Número do relatório');

  if(r.meta.revision!=='00')throw new Error('Um novo relatório deve começar na revisão 00.');
  if(state.attempt&&JSON.stringify(state.attempt.metadata)!==JSON.stringify(registrationMetadata(r)))throw new Error('Os dados da solicitação pendente foram alterados. Restaure os dados registrados antes de tentar novamente.');

  const preflight=clone(r);preflight.settings.draft=true;await render(preflight);
  if(!state.attempt)state.attempt={version:1,requestId:state.requestId,metadata:registrationMetadata(r),pdfValidated:true};
  state.status='pending';r.updatedAt=new Date().toISOString();
  if(!await save())throw new Error('Não foi possível preservar a solicitação. Salve o editável e tente novamente.');
  const receipt=validateReceipt(await submit(clone(state.attempt)),state.attempt);
  state.receipt=receipt;state.status='registered';

pan></div><div class="cover-stage" id="cover-live">${cover()}</div><div class="cover-note">Esboço da capa. Em “Visualizar”, confira o PDF com a paginação final.</div><div class="filename-box"><span class="eyebrow">Nome do arquivo</span><code data-filename>${esc(filenameFor(report))}.pdf</code></div></div><div class="support-card"><strong>Tópicos do serviço</strong>Adicione ensaios de isolação apenas quando fizerem parte do serviço. Cada tópico aceita textos, tabelas e fotos com legendas.${btn('Explorar tópicos','add-topic','plus','small')}</div></aside></div>`;}
function revisionsView(){return `<div class="page-heading"><div><h1>Histórico de revisão</h1><p class="subtle">Registre o que mudou em cada emissão do relatório.</p></div>${btn('Adicionar revisão','add-revision','plus')}</div>${card('Alterações do documento','A revisão atual da capa é '+esc(report.meta.revision)+'.',`${check('Incluir histórico no PDF','revisionOn')}<div class="table-wrap" style="margin-top:20px"><table class="edit-table"><thead><tr><th>Revisão</th><th>Data</th><th>Elaborado por</th><th>Descrição</th><th></th></tr></thead><tbody>${report.revisions.map((r,i)=>`<tr>${['revision','date','author','description'].map(k=>`<td><textarea aria-label="${k} da revisão ${i+1}" data-revision-index="${i}" data-key="${k}" rows="2">${esc(r[k])}</textarea></td>`).join('')}<td class="row-tools">${ib('Excluir revisão','remove-revision','trash',`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div><p class="note">Use datas no formato AAAA-MM-DD ou DD/MM/AAAA. A revisão da capa é editada em Dados do relatório.</p>`)}`;}
function sectionView(s){const index=report.sections.indexOf(s);return `<div class="page-heading"><div style="flex:1;min-width:0"><div class="eyebrow" style="margin-bottom:10px">Tópico ${String(index+1).padStart(2,'0')}</div><label><span class="sr-only">Título do tópico</span><input class="section-title-input" data-section-title="${s.id}" value="${esc(s.title)}" maxlength="400" placeholder="Título do tópico"></label><p class="subtle">Edite o título e organize os blocos na sequência do serviço.</p></div><div class="section-controls">${ib('Mover tópico para cima','section-up','up',index===0?'disabled':'')}${ib('Mover tópico para baixo','section-down','down',index===report.sections.length-1?'disabled':'')}${ib('Duplicar tópico','section-copy','copy')}${ib('Excluir tópico','section-delete','trash')}</div></div><div class="inline-flex mb"><label class="toggle-row"><input type="checkbox" data-section-break="${s.id}" ${s.breakBefore?'checked':''}>Iniciar este tópico em uma nova página</label></div>${s.blocks.map((b,i)=>blockView(b,i,s.blocks.length)).join('')}<div class="add-block"><span>Adicionar ao tópico</span>${btn('Texto','add-text','text')}${btn('Tabela','add-table','grid')}${btn('Fotos','add-photos','image')}</div><p class="note">Os resultados, critérios de aceitação e conclusões são informados por você. Os modelos de ensaio começam sem valores preenchidos.</p>`;}
function blockView(b,i,total){let body='';
 if(b.type==='text')body=`<textarea class="text-editor" aria-label="Texto do bloco ${i+1}" data-block-text="${b.id}" placeholder="Descreva a atividade, as constatações e os resultados…">${esc(b.text)}</textarea>`;
 if(b.type==='table')body=`<div class="table-wrap"><table class="edit-table"><thead><tr>${b.headers.map((h,c)=>`<th><textarea rows="2" aria-label="Cabeçalho ${c+1}" data-table="${b.id}" data-row="-1" data-col="${c}">${esc(h)}</textarea>${b.headers.length>1?ib('Excluir coluna '+(c+1),'table-remove-col','close',`data-block="${b.id}" data-col="${c}"`):''}</th>`).join('')}<th style="width:32px"></th></tr></thead><tbody>${b.rows.map((r,ri)=>`<tr>${b.headers.map((_,c)=>`<td><textarea rows="2" aria-label="Linha ${ri+1}, ${esc(b.headers[c])}" data-table="${b.id}" data-row="${ri}" data-col="${c}">${esc(r[c]??'')}</textarea></td>`).join('')}<td class="row-tools">${ib('Excluir linha '+(ri+1),'table-remove-row','trash',`data-block="${b.id}" data-row="${ri}"`)}</td></tr>`).join('')}</tbody></table></div><div class="table-actions">${btn('Adicionar linha','table-add-row','plus','small',`data-block="${b.id}"`)}${btn('Adicionar coluna','table-add-col','plus','small ghost',`data-block="${b.id}" ${b.headers.length>=10?'disabled':''}`)}${btn('Colar do Excel','table-paste','grid','small ghost',`data-block="${b.id}"`)}</div>`;
 if(b.type==='photos')body=`<div class="upload-area">${btn('Adicionar fotografias','photo-upload','upload','',`data-block="${b.id}"`)}<div>JPEG, PNG ou WebP · até 20 MB por foto<br>As fotos são ajustadas para o relatório e mantêm a proporção.</div></div><div class="photo-grid" style="grid-template-columns:${b.columns===1?'1fr':''}">${b.photos.map((p,pi)=>`<div class="photo-item"><img src="${esc(p.src)}" alt="${esc(p.caption||'Fotografia '+(pi+1))}" loading="lazy"><div class="photo-tools"><span>${esc(p.name||'Fotografia '+(pi+1))}</span><div class="inline-flex">${ib('Mover foto para antes','photo-up','up',`data-block="${b.id}" data-index="${pi}" ${pi===0?'disabled':''}`)}${ib('Mover foto para depois','photo-down','down',`data-block="${b.id}" data-index="${pi}" ${pi===b.photos.length-1?'disabled':''}`)}${ib('Excluir fotografia','photo-remove','trash',`data-block="${b.id}" data-index="${pi}"`)}</div></div><textarea aria-label="Legenda da foto ${pi+1}" data-photo-caption="${b.id}" data-index="${pi}" placeholder="Legenda da fotografia">${esc(p.caption)}</textarea></div>`).join('')}</div>`;
 return `<section class="card block"><div class="block-head"><h3>${icon(b.type==='text'?'text':b.type==='table'?'grid':'image')}Bloco ${i+1} · ${{text:'Texto',table:'Tabela',photos:'Fotografias'}[b.type]}</h3><div class="tools">${b.type==='text'?`<select class="inline-select" aria-label="Formato do texto" data-block-style="${b.id}"><option value="paragraph" ${b.style==='paragraph'?'selected':''}>Parágrafos</option><option value="bullet" ${b.style==='bullet'?'selected':''}>Lista com marcadores</option><option value="numbered" ${b.style==='numbered'?'selected':''}>Lista numerada</option></select>`:''}${b.type==='photos'?`<select class="inline-select" aria-label="Fotos por linha" data-photo-columns="${b.id}"><option value="2" ${b.columns===2?'selected':''}>2 por linha</option><option value="1" ${b.columns===1?'selected':''}>1 por linha</option></select>`:''}${ib('Mover bloco para cima','block-up','up',`data-block="${b.id}" ${i===0?'disabled':''}`)}${ib('Mover bloco para baixo','block-down','down',`data-block="${b.id}" ${i===total-1?'disabled':''}`)}${ib('Excluir bloco','block-delete','trash',`data-block="${b.id}"`)}</div></div><div class="block-body">${body}</div></section>`;
}
function modal(title,body,footer=''){dialog.innerHTML=`<div class="modal-head"><h2>${title}</h2>${ib('Fechar janela','close','close')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}`;if(!dialog.open)dialog.showModal();}
function topicsModal(){modal('Adicionar tópico',`<p class="subtle mb">Escolha um ponto de partida. Todos os títulos, campos e blocos são editáveis.</p><div class="preset-grid">${presets.map(p=>`<button class="preset" data-action="preset" data-key="${p.key}"><strong>${p.title}</strong><span>${p.description}</span></button>`).join('')}</div>`);}
function newModal(){modal('Novo relatório',`<p class="subtle mb">Comece com a identificação em branco e dois tópicos editáveis. O relatório atual fica nos seus rascunhos.</p><div class="preset-grid"><button class="preset" data-action="new-kind" data-kind="field"><strong>Field Service</strong><span>Inspeções, manutenção e comissionamento em campo.</span></button><button class="preset" data-action="new-kind" data-kind="center"><strong>Service Center</strong><span>Diagnóstico, reparos e testes em laboratório.</span></button></div>`);}
function catalogView(){const count=catalog?.records.length||0;return `<div class="page-heading"><div><h1>Controle de numeração</h1><p class="subtle">Consulte o último número de cada área. Abrir um rascunho não cria registros.</p></div><div class="inline-flex">${btn('Atualizar da planilha','sync-catalog','clock')}${numberingService.signInUrl?btn('Conectar à planilha','registry-signin','arrow'):''}${btn('Importar XLSX','xlsx-upload','upload')}</div></div><input id="xlsx-file" type="file" accept=".xlsx" hidden><div class="notice"><strong>${esc(catalog?.source||'Carregando planilha…')}</strong> · ${catalog?.date?'cópia importada em '+displayDate(catalog.date):'importe o controle em XLSX para consultar os registros'} · ${count} registros.<br><span data-registry-status>${esc(registryStatus)}</span><br>O próximo número é apenas uma prévia. O novo registro será solicitado somente em “Gerar definitivo”. Offline, você pode preparar e baixar o rascunho.</div><div class="card"><div class="card-body"><div class="import-row"><label class="field">Buscar registro<input id="catalog-search" placeholder="Número, projeto, cliente ou responsável"></label><label class="field">Aba<select id="catalog-sheet"><option value="">Todas</option><option value="FieldService">Field Service · F</option><option value="ServiceCenter">Service Center · L</option></select></label></div><div id="catalog-rows" style="margin-top:22px"></div></div></div><p class="note">Selecionar um registro preenche número, revisão, BU, projeto, cliente, responsável e localidade, quando disponível. A data completa e o conteúdo técnico são preenchidos no editor.</p>`;}
function renderCatalogRows(){const el=document.getElementById('catalog-rows');if(!el)return;const query=(document.getElementById('catalog-search')?.value||'').toLocaleLowerCase('pt-BR'),sheet=document.getElementById('catalog-sheet')?.value;
 const rows=(catalog?.records||[]).map((r,i)=>({...r,_i:i})).filter(r=>(!sheet||r.sheet===sheet)&&[r.number,r.client,r.project,r.author,r.location].join(' ').toLocaleLowerCase('pt-BR').includes(query)).reverse();
 el.innerHTML=rows.length?`<div class="table-wrap"><table class="edit-table catalog-table"><thead><tr><th>Número</th><th>Cliente / projeto</th><th>Responsável</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.number||'Dados incompletos')}</strong><small>${esc(r.sheet)}</small></td><td>${esc(r.client)}<small>${esc(r.project||'Sem projeto')}${r.location?' · '+esc(r.location):''}</small></td><td>${esc(r.author||'—')}</td><td>${btn('Usar','use-record','arrow','small',`data-index="${r._i}" ${!r.number?'disabled':''}`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum registro encontrado.</div>`;
}
function filesView(){return `<div class="page-heading"><div><h1>Meus relatórios</h1><p class="subtle">${db?'Rascunhos salvos neste navegador.':'Rascunhos disponíveis apenas nesta sessão.'} Baixe o editável para continuar depois.</p></div><div class="inline-flex">${btn('Abrir editável','restore','upload')}${btn('Novo relatório','new','plus','primary')}</div></div><div class="card"><div class="card-body inline-flex" style="justify-content:space-between"><div><h3>Salvar uma cópia do relatório aberto</h3><p class="subtle">O arquivo JSON inclui textos, tabelas e fotografias. Importe-o neste gerador para editar.</p></div>${btn('Baixar editável','backup','download')}</div></div><div class="file-list">${reports.map(r=>`<article class="report-card"><span class="eyebrow">${r.meta.kind==='center'?'Service Center':'Field Service'}${r.id===report.id?' · Aberto':''}</span><h3>${esc(r.meta.number?codeFor(r):'Relatório sem número')}</h3><p>${esc(r.meta.client||'Cliente a preencher')}<br>${esc(r.meta.location||'Localidade a preencher')}</p><p>${r.sections.length} tópicos · Atualizado em ${new Date(r.updatedAt).toLocaleString('pt-BR')}</p><div class="buttons">${btn('Abrir','open-report','file','small',`data-id="${r.id}"`)}${btn('Duplicar','copy-report','copy','small ghost',`data-id="${r.id}"`)}${ib('Excluir rascunho','delete-report','trash',`data-id="${r.id}"`)}</div></article>`).join('')}</div><p class="note">${db?'O armazenamento local não sincroniza entre dispositivos. Limpar os dados do navegador remove os rascunhos.':'Neste modo, fechar a página encerra a sessão e remove os rascunhos da memória.'} Use Baixar editável para guardar cada relatório e Abrir editável para retomá-lo.</p>`;}
async function getPdf(){const v=pdfVersion,r=clone(report);if(registryState(report).mode==='automatic'&&registryState(report).status!=='registered')r.settings.draft=true;const result=await generatePdf(r,await loadLogo());return {...result,version:v};}
async function renderPreview(){const token=++renderToken;const el=document.getElementById('view');const missing=missingFields(report);
 el.innerHTML=`<div class="page-heading"><div><h1>Visualização do relatório</h1><p class="subtle">Este é o PDF gerado, com as mesmas páginas do arquivo para download.</p></div>${btn('Baixar editável','backup','download')}</div><div class="pdf-toolbar"><div>${check('Exibir marca de rascunho','draft')}<p>Revise textos, valores, imagens e responsáveis antes de enviar ao cliente.</p></div><div class="inline-flex">${btn('Baixar rascunho','pdf-draft','download')}${btn(registryState(report).status==='registered'?'Baixar novamente':'Gerar definitivo','pdf-final','download','primary')}</div></div>${missing.length?`<div class="checks">${missing.map(x=>`<span class="warning">Falta: ${x}</span>`).join('')}</div>`:''}<div id="pdf-area" class="loading">Gerando páginas do relatório…</div>`;
 try{const result=await getPdf();if(view!=='preview'||token!==renderToken)return;if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(new Blob([result.bytes],{type:'application/pdf'}));const area=document.getElementById('pdf-area');area.className='';area.innerHTML=`<p class="subtle mb">${result.pageCount} páginas · ${esc(filenameFor(report))}.pdf · <a href="${pdfUrl}" target="_blank" rel="noopener">Abrir PDF em outra aba</a></p><object class="pdf-frame" data="${pdfUrl}" type="application/pdf"><div class="empty">Seu navegador não oferece visualização incorporada.<br><a href="${pdfUrl}" target="_blank" rel="noopener">Abrir o PDF</a></div></object>`;
 }catch(e){if(view==='preview'&&token===renderToken)document.getElementById('pdf-area').innerHTML=`<div class="error-box">${esc(e.message)}</div>`;}
}
function currentSection(){return report.sections.find(s=>s.id===view);}
function blockById(id){for(const s of report.sections){const b=s.blocks.find(b=>b.id===id);if(b)return b;}return null;}
function go(v){view=v;shell();window.scrollTo({top:0,behavior:'instant'});}

document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;if(issuing)return;
 if(d.meta){if(!canEditIdentity(d.meta)||(d.meta==='number'&&registryState(report).mode==='automatic')){t.value=report.meta[d.meta];return;}report.meta[d.meta]=t.value;changed();}
 if(d.sectionTitle){const s=report.sections.find(s=>s.id===d.sectionTitle);s.title=t.value;const label=document.querySelector(`.navitem[data-id="${s.id}"] .navlabel`);if(label)label.textContent=t.value||'Tópico sem título';changed();}
 if(d.blockText){blockById(d.blockText).text=t.value;changed();}
 if(d.table){const b=blockById(d.table),r=Number(d.row),c=Number(d.col);if(r===-1)b.headers[c]=t.value;else b.rows[r][c]=t.value;changed();}
 if(d.photoCaption){blockById(d.photoCaption).photos[Number(d.index)].caption=t.value;changed();}
 if(d.revisionIndex!==undefined){report.revisions[Number(d.revisionIndex)][d.key]=t.value;changed();}
 if(t.id==='catalog-search')renderCatalogRows();
});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
 if(d.setting){if(d.setting==='draft'&&!t.checked&&registryState(report).mode==='automatic'&&registryState(report).status!=='registered'){toast('O rascunho só se torna definitivo após a confirmação do registro na planilha.',true);t.checked=true;return;}report.settings[d.setting]=t.checked;changed();shell();}
 if(d.sectionBreak){report.sections.find(s=>s.id===d.sectionBreak).breakBefore=t.checked;changed();}
 if(d.blockStyle){blockById(d.blockStyle).style=t.value;changed();}
 if(d.photoColumns){blockById(d.photoColumns).columns=Number(t.value);changed();shell();}
 if(t.id==='catalog-sheet')renderCatalogRows();
 if(t.id==='photos-file'){await loadPhotos(t.files);t.value='';}
 if(t.id==='restore-file'){const f=t.files[0];try{if(f){if(f.size>100*1024*1024)throw new Error('O editável deve ter até 100 MB.');const next=validateReport(JSON.parse(await f.text()));if(!await persist())throw new Error('Baixe o editável atual antes de abrir outro relatório.');report=next;await persist();go('meta');toast('Arquivo editável aberto em um novo rascunho.');}}catch(e){toast(e.message,true);}t.value='';}
 if(t.id==='xlsx-file'){const f=t.files[0];if(!f)return;toast('Lendo o controle de numeração…');try{catalog=await readNumberingXlsx(f);catalog.ready=true;registryStatus='Cópia XLSX local · a gravação online depende da conexão';syncNumberPreview();await persist();try{if(!isPortable)localStorage.setItem('secheron-numbering',JSON.stringify(catalog));}catch{toast('Planilha carregada apenas nesta sessão; não foi possível salvar a cópia.',true);}shell();toast(`${catalog.records.length} registros importados. Nenhuma reserva foi feita no Excel online.`);}catch(e){toast(e.message,true);}t.value='';}
});
document.addEventListener('click',async e=>{
 const button=e.target.closest('[data-action]');if(!button)return;const a=button.dataset.action,d=button.dataset,s=currentSection();
 try{
  if(issuing)return;
  if(a==='sync-catalog'){await refreshCatalog(true);return;}
  if(a==='registry-signin'){const url=new URL(numberingService.signInUrl);if(url.protocol!=='https:')throw new Error('Endereço de conexão inválido.');window.open(url.href,'_blank','noopener,noreferrer');return;}
  if(a==='pdf-final'){await makeDefinitive();return;}
  if(a==='pdf-draft'){const copy=clone(report);copy.settings.draft=true;const result=await generatePdf(copy,await loadLogo());download(result.bytes,'RASCUNHO - '+filenameFor(copy)+'.pdf','application/pdf');toast('Rascunho baixado. Nenhum registro foi criado.');return;}
  if(a==='menu'){document.querySelector('.sidebar').classList.toggle('open');return;}
  if(a==='close'){dialog.close();return;}
  if(a==='install-app'){const result=await installApp();modal('Instalar aplicativo',`<p class="subtle">${esc(result.message)}</p>`,btn('Entendi','close',null,'primary'));return;}
  if(a==='update-app'){if(!await persist())return;if(!saved){toast('Baixe o editável antes de atualizar o aplicativo.',true);return;}if(!updateApp())toast('O aplicativo já está atualizado.');return;}
  if(a.startsWith('view-')){if(a==='view-files'){await persist();reports=(await dbAction('readonly',s=>s.getAll())).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));}go(a.slice(5));return;}
  if(a==='section'){go(d.id);return;}
  if(a==='new'){newModal();return;}
  if(a==='new-kind'){if(!await persist())return;report=newReport(d.kind);syncNumberPreview();pdfVersion++;await persist();dialog.close();go('meta');refreshCatalog();return;}
  if(a==='kind'){if(numberingLocked(report))throw new Error('A área já está vinculada à solicitação. Duplique para criar outro relatório.');report.meta.kind=d.kind;report.settings.equipmentOn=d.kind==='center';if(!report.meta.location&&d.kind==='center')report.meta.location='Laboratório - Sécheron Hasler do Brasil';const n=report.meta.number.match(/\d+([FL])\d{4}/);if(n&&n[1]!== (d.kind==='center'?'L':'F'))toast('O número atual pertence à outra área. Selecione o registro correto no controle.',true);changed();shell();return;}
  if(a==='add-topic'){topicsModal();return;}
  if(a==='preset'){const section=newSection(d.key);report.sections.push(section);changed();dialog.close();go(section.id);return;}
  if(a==='section-up'||a==='section-down'){moveItem(report.sections,report.sections.indexOf(s),a==='section-up'?-1:1);changed();shell();return;}
  if(a==='section-copy'){const c=clone(s);c.id=uid();c.title+=' (cópia)';c.blocks.forEach(b=>b.id=uid());report.sections.splice(report.sections.indexOf(s)+1,0,c);changed();go(c.id);return;}
  if(a==='section-delete'){modal('Excluir tópico?',`<p class="subtle">O tópico “${esc(s.title)}” e seus blocos serão removidos deste rascunho.</p>`,btn('Cancelar','close',null)+btn('Excluir tópico','section-delete-confirm','trash','danger'));return;}
  if(a==='section-delete-confirm'){report.sections=report.sections.filter(x=>x.id!==view);changed();dialog.close();go('meta');return;}
  if(a==='add-text'||a==='add-table'||a==='add-photos'){s.blocks.push(a==='add-text'?textBlock():a==='add-table'?tableBlock():photoBlock());changed();shell();return;}
  if(a==='block-up'||a==='block-down'){moveItem(s.blocks,s.blocks.findIndex(b=>b.id===d.block),a==='block-up'?-1:1);changed();shell();return;}
  if(a==='block-delete'){modal('Excluir bloco?',`<p class="subtle">O conteúdo deste bloco será removido.</p>`,btn('Cancelar','close',null)+btn('Excluir bloco','block-delete-confirm','trash','danger',`data-block="${d.block}"`));return;}
  if(a==='block-delete-confirm'){s.blocks=s.blocks.filter(b=>b.id!==d.block);changed();dialog.close();shell();return;}
  if(a==='table-add-row'){const b=blockById(d.block);b.rows.push(b.headers.map(()=>''));changed();shell();return;}
  if(a==='table-add-col'){const b=blockById(d.block);if(b.headers.length>=10)return;b.headers.push('Nova coluna');b.rows.forEach(r=>r.push(''));changed();shell();return;}
  if(a==='table-remove-row'){blockById(d.block).rows.splice(Number(d.row),1);changed();shell();return;}
  if(a==='table-remove-col'){const b=blockById(d.block);if(b.headers.length<2)return;b.headers.splice(Number(d.col),1);b.rows.forEach(r=>r.splice(Number(d.col),1));changed();shell();return;}
  if(a==='table-paste'){modal('Colar tabela do Excel',`<p class="subtle mb">Copie as células do Excel e cole abaixo. A primeira linha será o cabeçalho. Isso substitui a tabela selecionada.</p><textarea id="paste-data" class="paste" placeholder="Cole as células aqui"></textarea>`,btn('Cancelar','close',null)+btn('Aplicar tabela','apply-table-paste','check','primary',`data-block="${d.block}"`));return;}
  if(a==='apply-table-paste'){const rows=parseDelimited(document.getElementById('paste-data').value);if(!rows.length)throw new Error('Cole pelo menos a linha de cabeçalhos.');if(rows[0].length>10)throw new Error('Use até 10 colunas por tabela.');if(rows.length>2001)throw new Error('Use até 2.000 linhas por tabela.');const b=blockById(d.block);b.headers=rows.shift();b.rows=rows.map(r=>b.headers.map((_,c)=>r[c]||''));changed();dialog.close();shell();return;}
  if(a==='photo-upload'){photoTarget=d.block;document.getElementById('photos-file').click();return;}
  if(a==='photo-remove'){blockById(d.block).photos.splice(Number(d.index),1);changed();shell();return;}
  if(a==='photo-up'||a==='photo-down'){moveItem(blockById(d.block).photos,Number(d.index),a==='photo-up'?-1:1);changed();shell();return;}
  if(a==='add-revision'){report.revisions.push({revision:report.meta.revision,date:today(),author:report.meta.author,description:''});changed();shell();return;}
  if(a==='remove-revision'){report.revisions.splice(Number(d.index),1);changed();shell();return;}
  if(a==='backup'){download(JSON.stringify(report,null,2),filenameFor(report)+'.json','application/json');backedUpReports.set(report.id,report.updatedAt);saved=true;setSaveStatus(saveLabel());toast('Cópia editável exportada. Guarde o arquivo JSON para reabrir depois.');return;}
  if(a==='restore'){document.getElementById('restore-file').click();return;}
  if(a==='xlsx-upload'){document.getElementById('xlsx-file').click();return;}
  if(a==='use-record'){if(numberingLocked(report))throw new Error('A numeração já está vinculada a este relatório. Crie outro rascunho para selecionar um registro diferente.');report.numbering={mode:'existing',status:'draft',requestId:uid()};applyRecord(report,catalog.records[Number(d.index)]);changed();go('meta');toast('Identificação preenchida. Confira a data completa e o escopo.');return;}
  if(a==='open-report'){if(!await persist())return;const r=await dbAction('readonly',s=>s.get(d.id));if(!r)throw new Error('Rascunho não encontrado.');report=r;pdfVersion++;await persist();go('meta');return;}
  if(a==='copy-report'){if(!await persist())return;const r=await dbAction('readonly',s=>s.get(d.id));if(!r)throw new Error('Rascunho não encontrado.');report=validateReport(r);resetNumbering(report);syncNumberPreview();pdfVersion++;await persist();go('meta');toast('Novo rascunho criado. A prévia não reserva um número.');refreshCatalog();return;}
  if(a==='delete-report'){modal('Excluir rascunho?',`<p class="subtle">A cópia salva neste navegador será removida. Isso não exclui registros da planilha. Arquivos já baixados permanecem no seu computador.</p>`,btn('Cancelar','close',null)+btn('Excluir','delete-report-confirm','trash','danger',`data-id="${d.id}"`));return;}
  if(a==='delete-report-confirm'){await persist();await dbAction('readwrite',s=>s.delete(d.id));if(report.id===d.id){report=newReport();await persist();}reports=(await dbAction('readonly',s=>s.getAll())).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));dialog.close();shell();return;}
  if(a==='number-builder'){if(numberingLocked(report))throw new Error('A numeração já está vinculada à solicitação e não pode ser substituída.');const match=codeFor(report).match(/^(\d+)[FL](\d{2})(\d{2})/);modal('Montar número do relatório',`<p class="notice">Use somente para um relatório que já possui registro no Excel. Para um relatório novo, mantenha a numeração automática e use Gerar definitivo. Esta opção não escreve na planilha.</p><div class="fields"><label class="field">Sequência reservada<input id="num-seq" inputmode="numeric" value="${esc(match?.[1]||'')}" placeholder="Ex.: 041"></label><label class="field">Área<select id="num-kind"><option value="field" ${report.meta.kind==='field'?'selected':''}>Field Service · F</option><option value="center" ${report.meta.kind==='center'?'selected':''}>Service Center · L</option></select></label><label class="field">Mês<input id="num-month" maxlength="2" value="${match?.[2]||today().slice(5,7)}"></label><label class="field">Ano (dois dígitos)<input id="num-year" maxlength="2" value="${match?.[3]||today().slice(2,4)}"></label></div>`,btn('Cancelar','close',null)+btn('Aplicar número','number-apply','check','primary'));return;}
  if(a==='number-apply'){report.numbering={mode:'existing',status:'draft',requestId:uid()};const kind=document.getElementById('num-kind').value,n=numberFromParts(document.getElementById('num-seq').value,kind,document.getElementById('num-month').value,document.getElementById('num-year').value,report.meta.revision);report.meta.kind=kind;report.meta.number=n.replace(/\.\d{2}$/,'');report.meta.filename='';report.meta.sheet='';report.settings.equipmentOn=kind==='center';changed();dialog.close();shell();return;}
  if(a==='pdf-download'){
   if(!report.settings.draft){await makeDefinitive();return;}
   const missing=missingFields(report);if(!report.settings.draft&&missing.length)throw new Error('Preencha antes de emitir: '+missing.join(', ')+'. Você também pode exportar com a marca de rascunho.');
   if(!/^\d{1,2}$/.test(report.meta.revision))throw new Error('Use uma revisão numérica de 00 a 99.');
   button.disabled=true;toast('Gerando o PDF…');const filename='RASCUNHO - '+filenameFor(report);try{const result=await getPdf();download(result.bytes,filename+'.pdf','application/pdf');toast(`PDF gerado com ${result.pageCount} páginas.`);}finally{button.disabled=false;}return;
  }
  if(a==='help'){modal('Como usar o gerador',`<div style="font-size:13px;line-height:1.8"><p><strong>1. Comece um relatório novo.</strong> Field Service e Service Center possuem sequências independentes. A prévia mostra o próximo número disponível na última consulta, sem reservá-lo.</p><p><strong>2. Defina o serviço.</strong> Complete a data, a localidade, a solicitação, o escopo e os responsáveis. Ative os dados do equipamento quando necessário.</p><p><strong>3. Monte o conteúdo.</strong> Adicione tópicos, edite títulos e organize blocos de texto, tabelas e fotografias. As setas alteram a ordem no PDF.</p><p><strong>4. Gere quando estiver pronto.</strong> Visualizar e Baixar rascunho não escrevem no Excel. Gerar definitivo valida o PDF e solicita o registro; o número confirmado será usado no documento. Baixar novamente reutiliza o registro.</p><p><strong>5. Guarde o editável.</strong> Em Meus relatórios, baixe o JSON para backup ou para continuar em outro computador.</p><p class="notice">Este aplicativo não exige login do ChatGPT. Na versão portátil, baixe o editável antes de fechar. Na versão instalada pelo site, aguarde “Pronto para uso offline” antes de desconectar. A conexão online precisa ser ativada para registrar números automaticamente. Sem internet, prepare o rascunho e finalize quando houver conexão. A numeração prevista pode mudar se outro técnico emitir antes.</p></div>`);return;}
 }catch(e){toast(e.message||'Não foi possível concluir a operação.',true);button.disabled=false;}
});
async function loadPhotos(files){const b=blockById(photoTarget);if(!b)return;const selected=Array.from(files);if(b.photos.length+selected.length>100){toast('Use até 100 fotografias por bloco.',true);return;}let count=0;toast('Preparando fotografias…');
 for(const file of selected){try{
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error(`${file.name}: use JPEG, PNG ou WebP.`);
  if(file.size>20*1024*1024)throw new Error(`${file.name}: o limite é 20 MB por foto.`);
  const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});if(bitmap.width*bitmap.height>60000000){bitmap.close();throw new Error(`${file.name}: imagem grande demais. Reduza a resolução antes de enviar.`);}
  const scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
  b.photos.push({id:uid(),src:canvas.toDataURL('image/jpeg',.9),caption:'',name:file.name});count++;
 }catch(e){toast(e.message,true);}}
 if(count){changed();shell();await persist();toast(`${count} fotografia(s) adicionada(s).`);}
}
window.addEventListener('online',()=>refreshCatalog());
window.addEventListener('beforeunload',e=>{if(!saved){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!saved)persist();});
async function init(){
 if(!isPortable){try{db=await openDb();let key;try{key=localStorage.getItem('secheron-last-report');}catch{}if(key){const existing=await dbAction('readonly',s=>s.get(key));if(existing&&existing.version===1)report=existing;}}catch{db=null;toast('O navegador não disponibilizou o armazenamento. Use Baixar editável antes de fechar.',true);}}
 await persist();
 if(!isPortable){try{const cached=localStorage.getItem('secheron-numbering');catalog=cached?JSON.parse(cached):null;}catch{}}
 if(!catalog?.records)catalog=await defaultCatalog();
 if(catalog.records.length)catalog.ready=true;
 registryState(report);syncNumberPreview();await persist();shell();setupOffline();refreshCatalog();
}
init();

})();</script>
